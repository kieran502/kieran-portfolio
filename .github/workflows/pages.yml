# Builds the review copy of the site and publishes it to GitHub Pages on every push to main.
# The review copy carries a "do not index" tag (PUBLIC_REVIEW_BUILD) so search engines skip it.
name: Publish review copy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx astro check
      - run: npx astro build --site "https://${{ github.repository_owner }}.github.io/"
        env:
          PUBLIC_REVIEW_BUILD: 'true'
      # A repository not named <owner>.github.io is served from /<repo>/, so links need that prefix.
      - if: ${{ !endsWith(github.event.repository.name, '.github.io') }}
        run: node scripts/prefix-base.mjs dist "${{ github.event.repository.name }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
